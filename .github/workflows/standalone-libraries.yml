name: Standalone libraries

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: none

      - name: Check generated distributions
        run: node scripts/build-libraries.mjs --check

      - name: Check JavaScript syntax
        run: |
          node --check dist/bravemonkey.js
          node --check assets/app.js

      - name: Check PHP syntax
        run: php -l dist/BraveMonkey.php

      - name: Run cross-language conformance tests
        run: node tests/libraries.test.mjs

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Publish the two standalone libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/bravemonkey.js dist/BraveMonkey.php --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/bravemonkey.js dist/BraveMonkey.php --generate-notes
          fi
